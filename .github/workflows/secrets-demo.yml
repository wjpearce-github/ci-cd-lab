# Reads a repository secret (Settings > Secrets and variables > Actions > API_TOKEN).
# GitHub masks secret values in logs; this prints only the length to prove it was set.
name: Secrets demo

on: workflow_dispatch

permissions:
  contents: read

jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Use the secret
        env:
          TOKEN: ${{ secrets.API_TOKEN }}
        run: echo "API_TOKEN is set (length ${#TOKEN})"
