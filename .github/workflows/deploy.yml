# Deploys to AWS using GitHub OIDC: no long-lived AWS keys are stored in GitHub.
#
# The IAM role's trust policy only accepts tokens whose `sub` claim matches this
# repo on the main branch. If you change how this job runs (e.g. add
# `environment:`, run from another branch, or use a reusable workflow), the
# `sub` claim changes and the trust policy must be updated to match.
name: Deploy

on: workflow_dispatch

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::437603324536:role/github-lab-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to request the OIDC token
      contents: read    # required by actions/checkout
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show the assumed AWS identity
        run: aws sts get-caller-identity

      - name: Deploy
        run: echo "push image to ECR and update the service here"
