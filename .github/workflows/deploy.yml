# Deploys to AWS with GitHub OIDC: no AWS keys are stored in GitHub.
# The role's trust policy only accepts tokens from this repo's main branch.
name: Deploy

on: workflow_dispatch

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::437603324536:role/github-lab-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets this job ask GitHub for an OIDC token
      contents: read    # lets actions/checkout read the repo
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show the assumed AWS identity
        run: aws sts get-caller-identity

      - name: Deploy
        run: echo "push image to ECR and update the service here"
